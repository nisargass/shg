version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: shg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: shg_saathi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shg_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "SHG Saathi Backend"
      ENV: "development"
      DEBUG: "true"
      DATABASE_URL: "postgresql://postgres:postgrespassword2026@db:5432/shg_saathi"
      SECRET_KEY: "shg_saathi_super_secure_jwt_secret_key_change_in_production_2026"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      AI_SERVICE_BASE_URL: "mock"
      AI_SERVICE_TIMEOUT_SECONDS: "10.0"
      AI_SERVICE_USE_MOCK_FALLBACK: "true"
      UPLOAD_DIR: "./uploads"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
